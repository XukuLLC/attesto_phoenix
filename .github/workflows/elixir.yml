name: Elixir CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build & Test (Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - elixir: "1.18.4"
            otp: "28.0"
          - elixir: "1.19.6"
            otp: "28.5.0.5"
          - elixir: "1.20.4"
            otp: "29.0.5"
            lint: true

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: attesto_phoenix_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MIX_ENV: test
      ATTESTO_SOURCE_PATH: ${{ github.workspace }}/attesto
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: localhost
      POSTGRES_DB: attesto_phoenix_test

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout Attesto core
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: XukuLLC/attesto
          ref: 3c3936af092233c8895abcce5ae0245600c339d4
          path: attesto

      - name: Verify Attesto core revision
        working-directory: attesto
        run: test "$(git rev-parse HEAD)" = "3c3936af092233c8895abcce5ae0245600c339d4"

      - name: Set up Elixir
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - name: Restore dependencies cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: deps
          key: ${{ runner.os }}-${{ matrix.otp }}-${{ matrix.elixir }}-attesto-3c3936af092233c8895abcce5ae0245600c339d4-${{ hashFiles('attesto/**') }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.otp }}-${{ matrix.elixir }}-attesto-3c3936af092233c8895abcce5ae0245600c339d4-${{ hashFiles('attesto/**') }}-mix-

      - name: Restore build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: _build
          key: ${{ runner.os }}-${{ matrix.otp }}-${{ matrix.elixir }}-attesto-3c3936af092233c8895abcce5ae0245600c339d4-${{ hashFiles('attesto/**') }}-build-${{ hashFiles('**/mix.lock') }}-${{ hashFiles('**/mix.exs') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.otp }}-${{ matrix.elixir }}-attesto-3c3936af092233c8895abcce5ae0245600c339d4-${{ hashFiles('attesto/**') }}-build-

      - name: Install dependencies
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get

      - name: Audit dependency advisories
        if: ${{ matrix.lint }}
        run: mix hex.audit

      - name: Install Phoenix installer archive
        run: mix archive.install hex phx_new 1.8.13 --force

      # The RFC 8252 native-app end-to-end test (@moduletag :e2e) drives the
      # real `openid-client` against a live Bandit server. Node ships on the
      # runner; install the JS deps so the test runs rather than self-skipping.
      - name: Install Node end-to-end dependencies (openid-client)
        run: npm ci --no-audit --no-fund --prefix test/support/js

      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors

      - name: Run tests
        run: mix test --include ecto --trace

      - name: Check formatting
        if: ${{ matrix.lint }}
        run: mix format --check-formatted

      - name: Run Credo
        if: ${{ matrix.lint }}
        run: mix credo --strict

      - name: Build docs
        if: ${{ matrix.lint }}
        env:
          MIX_ENV: dev
        run: mix docs

      - name: Compile minimum consumer without optional Req
        # Exercise the exact source checkout above while the fixture keeps the
        # oldest supported Attesto release and dependency set.
        if: ${{ matrix.lint }}
        working-directory: integration/consumer_without_req
        env:
          MIX_ENV: prod
        run: |
          set -o pipefail
          mix deps.get
          mix deps.compile
          compile_log="${RUNNER_TEMP}/attesto_phoenix_minimum_compile.log"
          mix deps.compile attesto_phoenix --force 2>&1 | tee "$compile_log"
          if grep -F "warning:" "$compile_log"; then
            echo "AttestoPhoenix emitted a compiler warning against the minimum dependency set" >&2
            exit 1
          fi
          mix run --no-start verify.exs


  released-consumer:
    name: Released Attesto 2.6.0 minimum consumer
    needs: build
    runs-on: ubuntu-latest
    env:
      MIX_ENV: prod

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Elixir
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: "1.20.4"
          otp-version: "29.0.5"

      - name: Compile minimum consumer against released Attesto 2.6.0
        # Attesto 2.6.0 is published before the Phoenix release tag is created.
        # This fresh job has no source opt-in or source-built artifacts.
        working-directory: integration/consumer_without_req
        run: |
          set -o pipefail
          mix local.hex --force
          mix local.rebar --force
          mix deps.get
          mix deps.compile
          compile_log="${RUNNER_TEMP}/attesto_phoenix_released_minimum_compile.log"
          mix deps.compile attesto_phoenix --force 2>&1 | tee "$compile_log"
          if grep -F "warning:" "$compile_log"; then
            echo "AttestoPhoenix emitted a compiler warning against released Attesto 2.6.0" >&2
            exit 1
          fi
          mix run --no-start verify.exs
